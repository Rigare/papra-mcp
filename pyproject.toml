[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papra-mcp"
version = "0.2.0"
description = "MCP server for the Papra document management API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "papra", "document-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.0 renamed mcp.server.fastmcp to mcp.server.mcpserver (FastMCP -> MCPServer),
    # which breaks this server on import. Pinned until the migration is done.
    "mcp[cli]>=1.9.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Rigare/papra-mcp"
Repository = "https://github.com/Rigare/papra-mcp"

[project.scripts]
papra-mcp = "papra_mcp:main"

[tool.hatch.build.targets.wheel]
include = ["papra_mcp.py"]

[tool.hatch.build.targets.sdist]
include = ["papra_mcp.py", "tests/", "README.md", "AGENTS.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nested `with patch(...)` / `with pytest.raises(...)` reads better than the
# combined form, and bare asserts are the point in tests.
"tests/*" = ["B011", "SIM117"]
